spring.application.name=smart-movie-platform

# Les valeurs sensibles sont lues dans les variables d'environnement (jamais écrites dans le dépôt)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/movie_platform?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.open-in-view=false

server.port=8081

# Clé secrète JWT — minimum 32 caractères
application.security.jwt.secret-key=${JWT_SECRET}
# 30 jours
application.security.jwt.expiration=2592000000

tmdb.api.key=${TMDB_API_KEY}
tmdb.api.url=https://api.themoviedb.org/3

# ✅ Upload vidéo — augmenté pour supporter des fichiers films (jusqu'à 2GB)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2048MB
spring.servlet.multipart.max-request-size=2048MB
file.upload-dir=uploads/videos

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
